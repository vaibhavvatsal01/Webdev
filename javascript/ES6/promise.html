<!DOCTYPE html>

<head>
    
</head>
<body>
    <Script>
const mypromise=new Promise((resolve,reject)=>{
    const password="vai";
    if(password.length>8){
        resolve("password length is ok");
    }else{
        reject("password is shorter in length");

    }
})
mypromise.then((msg)=>{
    console.log(msg);
})
mypromise.catch((err)=>{
console.log(err);
})


    </Script>
    
</body>
</html>
